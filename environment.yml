name: rugpt
channels:
  - pytorch
  - nvidia
  - conda-forge
variables:
  DS_BUILD_SPARSE_ATTN: 1
  DS_BUILD_CPU_ADAM: 1
dependencies:
  - ipykernel
  - ipywidgets
  - jupyterlab_widgets
  - python<3.10 # python 3.9 for triton
  - pip
  - nbdev
# https://anaconda.org/pytorch/pytorch/files
# https://anaconda.org/pytorch-nightly/pytorch/files
  - pytorch=1.13.1=*cuda11.7* # <2.0 for deepspeed
  - cuda-toolkit==11.7
  - cudatoolkit-dev==11.7
  - cuda-nvcc>=11.7,<11.8
  - gxx<12
  - tqdm
  - psycopg2
  - SQLAlchemy
  - pandas
  - Pillow
  - voila
  - fastapi==0.63.0
  - uvicorn
  - transformers==4.12.5
  - tokenizers
  - diffusers
  - datasets
  - scipy
  - dateparser
  - matplotlib
  - plotly
  - ftfy
  - schedule
  - psutil
  - pymilvus
  - wrapt
#
  - tensorboard
  - nltk
  - sentencepiece
  - boto3
  - regex
  - uvicorn[standard]
  - ninja
  - mpi4py
  - pip:
    #- triton 
    #- deepspeed
    - cpufeature
    - pytelegrambotapi
    - tendo
    - docker
